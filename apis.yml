aid: morf
name: Morf
description: >-
  Morf is a HIPAA-compliant healthcare automation and integration platform that
  connects EHRs, CRMs, payment systems, and communication tools so digital
  health teams can eliminate manual work and put patient outreach on autopilot.
  Workflows are triggered by inbound webhooks from source applications (Healthie,
  Elation, Medplum, Feathery, athenahealth, Cerbo, DrChrono, Hint Health, and
  dozens more), which Morf processes into events that fan out to actions across
  30+ connected applications. The platform exposes a REST API at
  api.morf.healthcare secured with API keys and OAuth 2.0 / OpenID Connect
  (auth.morf.health), a webhook ingestion surface, an integration/action catalog
  of 170+ pre-built actions, and Flo AI, a no-code workflow co-pilot.
